name: Publish release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Test and build source tree
        run: |
          python -m pip install -e ".[dev]"
          python -m ruff format --check src tests scripts
          python -m ruff check src tests scripts
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest -q
          python -m build
          python -m twine check dist/*
      - name: Install wheel into a fresh environment
        run: |
          python -m venv .release-venv
          .release-venv/bin/python -m pip install --upgrade pip
          .release-venv/bin/python -m pip install dist/*.whl pytest
          .release-venv/bin/python -m playwright install --with-deps chromium
      - name: Verify installed package and real browser proof
        env:
          F2S_LABEL_API_TOKEN_1: runtime-demo-token
          FLOW2SKILL_LIVE: "1"
          FLOW2SKILL_ALLOW_SIDE_EFFECTS: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONPATH: ""
        run: |
          .release-venv/bin/flow2skill --version
          .release-venv/bin/flow2skill doctor
          .release-venv/bin/flow2skill demo --out .release-demo
          .release-venv/bin/python -m pytest -q .release-demo/test_agent_release_gate.py
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/*
          if-no-files-found: error

  publish-pypi:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/flow2skill
    permissions:
      id-token: write
    steps:
      - name: Check whether the release already exists on PyPI
        id: pypi
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import urllib.error
          import urllib.request

          version = os.environ["RELEASE_TAG"].removeprefix("v")
          url = f"https://pypi.org/pypi/flow2skill/{version}/json"
          try:
              urllib.request.urlopen(url, timeout=30).close()
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise
              exists = "false"
          else:
              exists = "true"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"exists={exists}\n")
          PY
      - uses: actions/download-artifact@v4
        if: steps.pypi.outputs.exists != 'true'
        with:
          name: python-package-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: steps.pypi.outputs.exists != 'true'
