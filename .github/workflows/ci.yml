name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -q

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff format --check src tests scripts examples
      - run: python -m ruff check src tests scripts examples
      - run: python -m compileall -q src tests scripts examples
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/verify_release.py
      - name: Verify source archive includes a runnable test suite
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          mkdir .sdist-check
          tar -xzf dist/flow2skill-*.tar.gz -C .sdist-check --strip-components=1
          python -m pytest -q .sdist-check/tests
      - uses: actions/upload-artifact@v4
        with:
          name: flow2skill-distributions
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: flow2skill-browser-tests
          path: |
            tests/test_studio_browser.py
            tests/test_bundle_shells.py
          if-no-files-found: error

  browser-proof:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: flow2skill-distributions
          path: dist
      - name: Install the user-facing test extra from the built wheel
        run: |
          python -m venv .proof-venv
          .proof-venv/bin/python -m pip install "$(echo dist/*.whl)[test]"
          .proof-venv/bin/python -m pip check
          .proof-venv/bin/python -m playwright install --with-deps chromium
      - name: Run the source archive regression trial against the installed wheel
        run: |
          mkdir .sdist-trial
          tar -xzf dist/flow2skill-*.tar.gz -C .sdist-trial --strip-components=1
          .proof-venv/bin/python .sdist-trial/examples/scoped_trial.py
      - name: Run the packaged demo outside a source checkout
        env:
          F2S_LABEL_API_TOKEN_1: runtime-demo-token
          FLOW2SKILL_LIVE: "1"
          FLOW2SKILL_ALLOW_SIDE_EFFECTS: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONPATH: ""
        run: |
          .proof-venv/bin/flow2skill --version
          .proof-venv/bin/flow2skill demo --out .ci-demo
          .proof-venv/bin/python -m pytest -q .ci-demo/test_agent_release_gate.py
      - uses: actions/download-artifact@v4
        with:
          name: flow2skill-browser-tests
          path: .browser-tests
      - name: Verify Studio export and recorder recovery against the installed wheel
        env:
          FLOW2SKILL_BROWSER_TESTS: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONPATH: ""
        run: .proof-venv/bin/python -m pytest -q .browser-tests/test_studio_browser.py .browser-tests/test_bundle_shells.py

  windows-bundle-proof:
    needs: quality
    runs-on: windows-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: flow2skill-distributions
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: flow2skill-browser-tests
          path: .browser-tests
      - name: Install built wheel with test extra
        shell: pwsh
        run: |
          python -m venv .proof-venv
          $wheel = (Get-ChildItem dist/*.whl).FullName
          .proof-venv/Scripts/python.exe -m pip install "${wheel}[test]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .proof-venv/Scripts/python.exe -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .proof-venv/Scripts/python.exe -m playwright install chromium
          exit $LASTEXITCODE
      - name: Execute PowerShell and Command Prompt README instructions
        env:
          FLOW2SKILL_BROWSER_TESTS: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONPATH: ""
        run: .proof-venv/Scripts/python.exe -m pytest -q .browser-tests/test_bundle_shells.py
